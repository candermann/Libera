services:
  bibliomat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: bibliomat:latest
    container_name: bibliomat
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ${BIBLIOMAT_DATA_DIR:-./data}:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
